<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tinta Hujan — kumpulan puisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F4; --ink:#1A2B3B; --muted:#5B6D7C; --line:#C9D4DC; --accent:#2B6B66; --sel:#DCE6EB;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1923; --ink:#DCE6EE; --muted:#8FA3B3; --line:#263847; --accent:#8FD0C4; --sel:#17293A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1923; --ink:#DCE6EE; --muted:#8FA3B3; --line:#263847; --accent:#8FD0C4; --sel:#17293A; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Spectral",Georgia,"Times New Roman",serif;line-height:1.7;font-size:18px}
.wrap{max-width:62rem;margin:0 auto;padding:3.5rem 1.5rem 4rem}
header{margin-bottom:3rem;max-width:34rem}
h1{font-weight:300;font-size:clamp(2.6rem,8vw,4.6rem);line-height:1.05;margin:0 0 1rem;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-style:italic;font-weight:300;font-size:1.1rem}
.layout{display:grid;grid-template-columns:15rem 1fr;gap:3rem;align-items:start}
nav{position:sticky;top:2rem;border-left:1px solid var(--line)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;margin-left:-1px;padding:.7rem 1rem;font:inherit;color:var(--muted);cursor:pointer}
nav button .t{display:block;font-size:1.15rem;color:var(--ink)}
nav button .f{display:block;font-size:.88rem;font-style:italic;font-weight:300;line-height:1.4}
nav button[aria-current="true"]{border-left-color:var(--accent);background:var(--sel)}
nav button:hover{background:var(--sel)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
article{min-height:26rem;max-width:34rem}
article h2{font-weight:400;font-size:1.05rem;margin:0 0 1.8rem;color:var(--accent);font-style:italic}
.stanza{margin:0 0 1.9rem}
.stanza span{display:block;font-size:clamp(1.3rem,3.6vw,1.65rem);font-weight:300;line-height:1.55}
.stanza span.in{animation:rise .7s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;display:flex;gap:1rem;align-items:center;justify-content:space-between}
.foot button{font:inherit;background:none;border:1px solid var(--line);color:var(--ink);padding:.35rem .9rem;border-radius:999px;cursor:pointer}
.foot button:hover{border-color:var(--accent);color:var(--accent)}
footer{margin-top:4rem;color:var(--muted);font-size:.85rem}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;gap:2rem}
  nav{position:static;display:flex;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line)}
  nav button{width:auto;flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;margin:0 0 -1px}
  nav button .f{display:none}
  nav button[aria-current="true"]{border-bottom-color:var(--accent)}
  .wrap{padding-top:2.5rem}
}
@media (prefers-reduced-motion:reduce){.stanza span.in{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tinta Hujan</h1>
    <p>Empat puisi pendek tentang hal-hal yang diam-diam menetap: hujan, rindu, kota, dan pagi.</p>
  </header>
  <div class="layout">
    <nav id="nav" aria-label="Daftar puisi"></nav>
    <article id="poem" aria-live="polite"></article>
  </div>
  <footer>Puisi-puisi di halaman ini ditulis orisinal untuk laman ini.</footer>
</div>
<script>
var poems=[
 {id:"hujan",title:"Hujan Sore",note:"Ditulis untuk sore yang tak jadi cerah.",st:[
  ["Hujan turun tanpa mengetuk,","langsung masuk ke dalam percakapan kita","yang sudah lama kehabisan kata."],
  ["Genting menghitung butirnya,","jalanan menyimpan cermin kecil,","dan aku belajar diam","seperti payung yang terlipat."],
  ["Barangkali hujan hanya ingin","mengingatkan bahwa langit pun","pernah terlalu penuh."]]},
 {id:"rindu",title:"Kunci Lama",note:"Tentang rindu yang tak punya alamat.",st:[
  ["Rindu tidak pernah memakai alamat.","Ia tiba di sela jam sibuk,","di antara gelas kopi dan layar yang menyala."],
  ["Kusimpan ia seperti kunci lama:","tak lagi membuka pintu apa pun,","tapi berat di saku, dan hangat."]]},
 {id:"kota",title:"Lantai Sembilan",note:"Kota, dilihat dari satu jendela.",st:[
  ["Kota bangun sebelum matahari selesai berpikir.","Klakson menjadi azan kedua,","asap menjadi kabut pinjaman dari gunung."],
  ["Di halte, orang-orang menggenggam pagi","seperti tiket yang takut hilang."],
  ["Tapi di satu jendela lantai sembilan","seseorang menyiram sebatang lidah mertua,","dan kota sejenak belajar sabar."]]},
 {id:"fajar",title:"Menit Pertama",note:"Pagi, sebelum dunia punya pendapat.",st:[
  ["Sebelum ayam, sebelum berita,","ada satu menit ketika dunia","belum punya pendapat."],
  ["Embun menulis namanya di daun","lalu menghapusnya sendiri."],
  ["Aku berdiri di ambang pintu,","belajar menjadi sesuatu","yang belum selesai."]]}
];
var nav=document.getElementById("nav"),art=document.getElementById("poem"),cur=0;
poems.forEach(function(p,i){
  var b=document.createElement("button");
  b.innerHTML='<span class="t"></span><span class="f"></span>';
  b.children[0].textContent=p.title;
  b.children[1].textContent=p.st[0][0];
  b.onclick=function(){show(i,true)};
  nav.appendChild(b);
});
function show(i,push){
  cur=i;var p=poems[i];
  Array.prototype.forEach.call(nav.children,function(b,k){b.setAttribute("aria-current",k===i?"true":"false")});
  art.innerHTML="";
  var h=document.createElement("h2");h.textContent=p.title;art.appendChild(h);
  var n=0;
  p.st.forEach(function(s){
    var d=document.createElement("div");d.className="stanza";
    s.forEach(function(l){
      var sp=document.createElement("span");sp.textContent=l;sp.className="in";
      sp.style.animationDelay=(n++*90)+"ms";d.appendChild(sp);
    });
    art.appendChild(d);
  });
  var f=document.createElement("div");f.className="foot";
  var t=document.createElement("span");t.textContent=p.note;
  var nx=document.createElement("button");nx.textContent="Puisi berikutnya";
  nx.onclick=function(){show((cur+1)%poems.length,true)};
  f.appendChild(t);f.appendChild(nx);art.appendChild(f);
  if(push){try{history.replaceState(null,"","#"+p.id)}catch(e){location.hash=p.id}}
}
function fromHash(){
  var h=(location.hash||"").slice(1),i=0;
  poems.forEach(function(p,k){if(p.id===h)i=k});
  show(i,false);
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
